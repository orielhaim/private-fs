[package]
name = "private-fs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Handle-oriented private filesystem capabilities and atomic publication"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orielhaim/private-fs"
include = [
  "src/**",
  "benches/**",
  "README.md",
  "SECURITY.md",
  "LICENSE-*",
  "Cargo.toml",
  "Cargo.lock",
]

[features]
# Exercise the security-equivalent Linux fallback in CI and benchmarks.
force-walk = []

[dependencies]
thiserror = "2"
getrandom = "0.4.3"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3"
divan = "0.1"
rstest = { version = "0.27", default-features = false }

[[bench]]
name = "filesystem"
harness = false
[workspace]
members = ["tools/windows-bindings"]
resolver = "3"

[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-link = "0.100"
